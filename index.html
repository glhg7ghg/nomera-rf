<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0b0d11">

    <title>Номера РФ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ВЕРХ -->

    <header class="top">

        <div class="logo-box">
            🚘
        </div>

        <div class="logo-text">

            <div class="logo-title">
                НОМЕРА РФ
            </div>

            <div class="logo-subtitle">
                Коллекционируй номера
            </div>

        </div>

        <button
            class="balance"
            id="balanceBtn"
        >
            💰
            <span id="balance">
                49 999 ₽
            </span>
        </button>

    </header>


    <!-- ОСНОВА -->

    <main id="content"></main>


    <!-- НИЖНЕЕ МЕНЮ -->

    <nav class="bottom-nav">

        <button
            class="nav active"
            data-page="home"
        >
            <div>🎰</div>
            <span>Игра</span>
        </button>

        <button
            class="nav"
            data-page="storage"
        >
            <div>📦</div>
            <span>Хранилище</span>
        </button>

        <button
            class="nav"
            data-page="top"
        >
            <div>🏆</div>
            <span>Топ</span>
        </button>

        <button
            class="nav"
            data-page="profile"
        >
            <div>👤</div>
            <span>Профиль</span>
        </button>

    </nav>


    <!-- УВЕДОМЛЕНИЕ -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- ПРОМОКОД -->

    <div
        class="modal hidden"
        id="promoModal"
    >

        <div
            class="modal-bg"
            id="closePromo1"
        ></div>

        <div class="modal-window">

            <button
                class="close"
                id="closePromo2"
            >
                ✕
            </button>

            <div class="modal-title">
                🎟 Промокод
            </div>

            <div class="modal-description">
                Введи промокод и получи деньги.
            </div>

            <input
                id="promoInput"
                class="promo-input"
                placeholder="Введи промокод"
                autocomplete="off"
            >

            <button
                id="promoButton"
                class="main-button"
            >
                АКТИВИРОВАТЬ
            </button>

        </div>

    </div>


</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="script.js"></script>

</body>

</html>
