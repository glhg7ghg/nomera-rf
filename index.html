<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Номера РФ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="app">

        <header>
            <div class="logo">
                🚘 НОМЕРА РФ
            </div>

            <div class="balance">
                💰 49 999 ₽
            </div>
        </header>


        <main>

            <div class="car">
                🚘
            </div>

            <div class="plate">
                А123ВС
                <span>77</span>
            </div>

            <div class="rarity">
                ⭐ Обычный
            </div>

            <div class="price">
                1 250 ₽
            </div>

            <button
                class="roll-button"
                onclick="rollNumber()"
            >
                🎰 КРУТИТЬ
            </button>

        </main>


        <nav>

            <button onclick="showHome()">
                🏠
                <span>Главная</span>
            </button>

            <button onclick="showStorage()">
                📦
                <span>Хранилище</span>
            </button>

            <button onclick="showProfile()">
                👤
                <span>Профиль</span>
            </button>

        </nav>

    </div>

    <script src="script.js"></script>

</body>

</html>
